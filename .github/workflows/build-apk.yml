
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar projeto
        run: |
          unzip -o TrilhaDeEventoAndroid_GitHub.zip
          printf '\ndependencies { implementation("androidx.activity:activity-ktx:1.9.3") }\n' >> TrilhaDeEventoAndroid/app/build.gradle.kts

      - name: Compilar
        run: gradle -p TrilhaDeEventoAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Trilha-de-Evento-APK
          path: TrilhaDeEventoAndroid/app/build/outputs/apk/debug/app-debug.apk
